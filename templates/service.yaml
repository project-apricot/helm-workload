{{- $ports := include "workload.servicePorts" . | fromYamlArray }}
{{- if and .Values.service.enabled $ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workload.fullname" . }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
  {{- with include "workload.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    {{- include "workload.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $ports }}
    - name: {{ .name }}
      port: {{ .containerPort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
{{- end }}
{{- if and .Values.statefulset.enabled .Values.statefulset.headlessService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workload.headlessName" . }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
  {{- with include "workload.annotations" (dict "ctx" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  selector:
    {{- include "workload.selectorLabels" . | nindent 4 }}
  {{- with .Values.ports }}
  ports:
    {{- range . }}
    - name: {{ .name }}
      port: {{ .containerPort }}
      targetPort: {{ .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  {{- end }}
{{- end }}
