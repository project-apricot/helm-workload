suite: hpa
templates:
  - hpa.yaml
release:
  name: example
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: targets the Deployment
    set:
      autoscaling.enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: example
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 3
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80

  - it: targets the StatefulSet
    set:
      autoscaling.enabled: true
      deployment.enabled: false
      statefulset.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet

  - it: adds a memory metric and behavior
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: ""
      autoscaling.targetMemoryUtilizationPercentage: 75
      autoscaling.behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 75
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
