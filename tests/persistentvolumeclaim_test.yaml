suite: persistentvolumeclaim
templates:
  - persistentvolumeclaim.yaml
release:
  name: example
tests:
  - it: renders nothing without PVCs
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PVC that Helm keeps on uninstall
    set:
      persistentVolumeClaims:
        data:
          mountPath: /var/data
          storage: 10Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: example-data
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
      - equal:
          path: spec
          value:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

  - it: lets a PVC override the keep policy
    set:
      persistentVolumeClaims:
        data:
          storage: 10Gi
          annotations:
            helm.sh/resource-policy: delete
            example.test/x: value
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: delete
            example.test/x: value

  - it: binds to a pre-created volume
    set:
      persistentVolumeClaims:
        data:
          storage: 10Gi
          volumeName: pre-created
          accessModes: [ReadWriteMany]
    asserts:
      - equal:
          path: spec.volumeName
          value: pre-created
      - equal:
          path: spec.accessModes
          value: [ReadWriteMany]

  - it: uses the cluster storage class unless the PVC names one
    set:
      cluster.localStorageClassName: cluster-class
      persistentVolumeClaims:
        a:
          storage: 1Gi
        b:
          storage: 1Gi
          storageClassName: own-class
    asserts:
      - equal:
          path: spec.storageClassName
          value: cluster-class
        documentIndex: 0
      - equal:
          path: spec.storageClassName
          value: own-class
        documentIndex: 1

  - it: leaves the storage class to the cluster by default
    set:
      persistentVolumeClaims:
        a:
          storage: 1Gi
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: requires a size
    set:
      persistentVolumeClaims:
        data:
          mountPath: /var/data
    asserts:
      - failedTemplate:
          errorPattern: "persistentVolumeClaims.data.storage is required"
