suite: serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: example
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceAccount named after the release
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: example
      - notExists:
          path: automountServiceAccountToken

  - it: honours name, annotations and automount
    set:
      serviceAccount.create: true
      serviceAccount.name: custom
      serviceAccount.annotations:
        example.test/role: app
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: metadata.name
          value: custom
      - equal:
          path: metadata.annotations["example.test/role"]
          value: app
      - equal:
          path: automountServiceAccountToken
          value: false
