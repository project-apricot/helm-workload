suite: externalsecret
templates:
  - externalsecret.yaml
release:
  name: example
tests:
  - it: renders nothing without ExternalSecrets
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret that creates a Secret of the same name
    set:
      cluster.clusterSecretStore: store
      externalSecrets:
        creds:
          enabled: true
          remoteRefs:
            DATABASE_URL: DATABASE_URL_IN_STORE
            TOKEN: TOKEN_IN_STORE
    asserts:
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: example-creds
      - equal:
          path: spec
          value:
            refreshInterval: 1h
            secretStoreRef:
              name: store
              kind: ClusterSecretStore
            target:
              name: example-creds
              creationPolicy: Owner
              deletionPolicy: Retain
            data:
              - secretKey: DATABASE_URL
                remoteRef:
                  key: DATABASE_URL_IN_STORE
                  conversionStrategy: Default
                  decodingStrategy: None
                  metadataPolicy: None
              - secretKey: TOKEN
                remoteRef:
                  key: TOKEN_IN_STORE
                  conversionStrategy: Default
                  decodingStrategy: None
                  metadataPolicy: None

  - it: lets an entry choose its store and refresh interval
    set:
      externalSecrets:
        creds:
          enabled: true
          refreshInterval: 5m
          secretStoreRef:
            name: own-store
            kind: SecretStore
          remoteRefs:
            A: B
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 5m
      - equal:
          path: spec.secretStoreRef
          value:
            name: own-store
            kind: SecretStore

  - it: skips disabled entries
    set:
      externalSecrets:
        creds:
          enabled: false
          remoteRefs:
            A: B
    asserts:
      - hasDocuments:
          count: 0

  - it: fails without a store
    set:
      externalSecrets:
        creds:
          enabled: true
          remoteRefs:
            A: B
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets.creds: set secretStoreRef.name or cluster.clusterSecretStore"

  - it: does not need a cluster store when the entry names its own
    set:
      externalSecrets:
        creds:
          enabled: true
          secretStoreRef:
            name: own-store
          remoteRefs:
            A: B
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: own-store

  - it: renders the fields the operator may default, so the live object has nothing extra
    set:
      cluster.clusterSecretStore: store
      externalSecrets:
        creds:
          enabled: true
          remoteRefs:
            A: B
    asserts:
      - equal:
          path: spec.target.deletionPolicy
          value: Retain
      - equal:
          path: spec.data[0].remoteRef.conversionStrategy
          value: Default
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: "None"
      - equal:
          path: spec.data[0].remoteRef.metadataPolicy
          value: "None"
      - notExists:
          path: spec.data[0].remoteRef.nullBytePolicy

  - it: leaves a defaulted field out when it is set to an empty string
    set:
      cluster.clusterSecretStore: store
      externalSecretDefaults:
        deletionPolicy: ""
        conversionStrategy: ""
        decodingStrategy: ""
        metadataPolicy: ""
      externalSecrets:
        creds:
          enabled: true
          remoteRefs:
            A: B
    asserts:
      - notExists:
          path: spec.target.deletionPolicy
      - equal:
          path: spec.data[0].remoteRef
          value:
            key: B

  - it: renders a field the operator writes that the chart does not default
    set:
      cluster.clusterSecretStore: store
      externalSecretDefaults:
        nullBytePolicy: Ignore
        decodingStrategy: Base64
      externalSecrets:
        creds:
          enabled: true
          remoteRefs:
            A: B
    asserts:
      - equal:
          path: spec.data[0].remoteRef.nullBytePolicy
          value: Ignore
      - equal:
          path: spec.data[0].remoteRef.decodingStrategy
          value: Base64

  - it: rejects a value the CRD would not accept
    set:
      externalSecretDefaults.deletionPolicy: Forget
    asserts:
      - failedTemplate:
          errorPattern: "deletionPolicy"
