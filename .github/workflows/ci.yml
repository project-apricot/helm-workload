name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: project-apricot/shared-workflows/.github/workflows/helm-chart-ci.yml@v1
    permissions:
      contents: read
    with:
      helm_version: 'v3.19.0'
      unittest: true
      kubeconform: true
      helm_docs: true
